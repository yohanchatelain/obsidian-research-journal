[project]
name = "obsidian-research-journal"
version = "0.1.0"
description = "A local research journal bridge for Obsidian and coding assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/yohanchatelain/obsidian-research-journal"
Issues = "https://github.com/yohanchatelain/obsidian-research-journal/issues"

[project.scripts]
research-journal = "research_journal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
